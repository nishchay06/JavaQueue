<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JavaQueue</title>
<style>
:root {
  --ground: #f6f7f9;
  --text: #191c21;
  --muted: #868c96;
  --rule: #e3e6eb;
  --fill: #edeff3;
  --accent: #4f5bd5;
  --ok: #3f9d6d;
  --warn: #c58a2c;
  --crit: #cf4b57;
  --shadow: rgba(16,18,22,.06);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #14161b;
    --text: #eceef2;
    --muted: #7c828d;
    --rule: #292d35;
    --fill: #1d2027;
    --accent: #838ef2;
    --ok: #57b487;
    --warn: #d3a24c;
    --crit: #e0636f;
    --shadow: rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 32px 28px 96px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* header */
header { display: flex; align-items: baseline; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
h1 .mk { color: var(--accent); }
header .sub { color: var(--muted); font-size: 13px; }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn.live .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ok) 22%, transparent); }
.conn.down .dot { background: var(--crit); }
.conn.live .dot { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
@media (prefers-reduced-motion: reduce) { .conn.live .dot { animation: none; } }

/* sections */
section { margin-top: 44px; }
.shead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.shead h2 { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin: 0; color: var(--text); }
.shead .desc { font-size: 12px; color: var(--muted); }
.shead .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.scroll { overflow-x: auto; margin-top: 14px; }

table { width: 100%; border-collapse: collapse; min-width: 640px; }
th { text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 16px 8px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th.r, td.r { text-align: right; }
td { padding: 12px 16px 12px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td:last-child, th:last-child { padding-right: 0; }
.name { font-weight: 500; }
.fig { color: var(--text); }
.fig.zero { color: var(--muted); }
.meta { color: var(--muted); font-size: 12px; }
.mono-small { font-family: var(--mono); font-size: 12px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border-radius: 3px; background: var(--fill); border: 1px solid var(--rule); color: var(--text); }
.chip.warn { border-color: color-mix(in oklch, var(--warn) 45%, var(--rule)); color: var(--warn); }
.warnpill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--crit); }
.warnpill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--crit); }

/* dlq / tags */
.tag { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--rule); color: var(--muted); }
.tag.on { color: var(--warn); border-color: color-mix(in oklch, var(--warn) 40%, var(--rule)); }
.dash { color: var(--muted); }

/* lag bar */
.lagcell { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.lagbar { width: 64px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; flex: none; }
.lagbar > i { display: block; height: 100%; background: var(--ok); border-radius: 3px; transition: width .3s ease; }
@media (prefers-reduced-motion: reduce){ .lagbar > i { transition: none; } }
.lagbar.warn > i { background: var(--warn); }
.lagbar.crit > i { background: var(--crit); }
.lagfig.ok { color: var(--muted); }
.lagfig.warn { color: var(--warn); }
.lagfig.crit { color: var(--crit); font-weight: 600; }

/* group rows */
.grp { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px 20px; align-items: center; }
.grp .gname { font-family: var(--mono); font-size: 12px; }

/* actions */
.act { display: flex; gap: 6px; align-items: center; }
input[type=text] {
  font-family: var(--mono); font-size: 12px; color: var(--text);
  background: var(--ground); border: 1px solid var(--rule); border-radius: 4px;
  padding: 5px 8px; width: 128px; min-width: 0;
}
input[type=text]::placeholder { color: var(--muted); }
button {
  font-family: var(--sans); font-size: 12px; color: var(--text);
  background: var(--fill); border: 1px solid var(--rule); border-radius: 4px;
  padding: 5px 10px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(.95); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.empty { color: var(--muted); font-size: 13px; padding: 20px 0; }
.banner { margin-top: 16px; padding: 10px 14px; border-radius: 5px; font-size: 13px; background: color-mix(in oklch, var(--crit) 12%, var(--ground)); border: 1px solid color-mix(in oklch, var(--crit) 40%, var(--rule)); color: var(--text); display: none; }
.banner.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Java<span class="mk">Queue</span></h1>
    <span class="sub">operator dashboard</span>
    <div class="conn" id="conn"><span class="dot"></span><span id="connText">connecting…</span></div>
  </header>

  <div class="banner" id="banner"></div>

  <section id="s-queues">
    <div class="shead">
      <h2>Queues</h2>
      <span class="desc">destructive read — one message, one consumer</span>
      <span class="count" id="qCount"></span>
    </div>
    <div class="scroll"><table>
      <thead><tr>
        <th>Name</th><th class="r">Depth</th><th class="r">In&nbsp;flight</th>
        <th class="r">Waiters</th><th>Dead-letter</th><th>Persist</th><th>Publish</th>
      </tr></thead>
      <tbody id="qBody"></tbody>
    </table></div>
  </section>

  <section id="s-topics">
    <div class="shead">
      <h2>Topics</h2>
      <span class="desc">fan-out — every subscriber gets a copy</span>
      <span class="count" id="tCount"></span>
    </div>
    <div class="scroll"><table>
      <thead><tr><th style="width:220px">Name</th><th>Subscribers</th></tr></thead>
      <tbody id="tBody"></tbody>
    </table></div>
  </section>

  <section id="s-logs">
    <div class="shead">
      <h2>Logs</h2>
      <span class="desc">retained — one copy, every group reads everything</span>
      <span class="count" id="lCount"></span>
    </div>
    <div id="logs"></div>
  </section>
</div>

<script>
"use strict";
const POLL_MS = 2000;
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
function fmt(v){ return num(v).toLocaleString('en-US'); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }

const EMPTY = { queues: [], topics: [], logs: [] };

const conn = document.getElementById('conn');
const connText = document.getElementById('connText');
const banner = document.getElementById('banner');
let everConnected = false;

// The queue table is rebuilt on every poll. Without capturing what is being
// typed first, a half-written message would vanish every two seconds.
function captureTyping(body){
  const active = document.activeElement;
  if (!active || !body.contains(active) || active.tagName !== 'INPUT') return null;
  const nameCell = active.closest('tr') && active.closest('tr').querySelector('.name');
  return {
    queue: nameCell ? nameCell.textContent : null,
    value: active.value,
    start: active.selectionStart,
    end: active.selectionEnd
  };
}

function restoreTyping(body, typing){
  if (!typing || !typing.queue) return;
  for (const row of body.querySelectorAll('tr')) {
    const nameCell = row.querySelector('.name');
    if (!nameCell || nameCell.textContent !== typing.queue) continue;
    const input = row.querySelector('input');
    if (!input) return;
    input.value = typing.value;
    input.focus();
    try { input.setSelectionRange(typing.start, typing.end); } catch (e) { /* not selectable */ }
    return;
  }
}

function renderQueues(qs){
  document.getElementById('qCount').textContent = qs.length + (qs.length===1?' queue':' queues');
  const body = document.getElementById('qBody');
  const typing = captureTyping(body);
  if(!qs.length){ body.innerHTML = '<tr><td colspan="7" class="empty">No queues.</td></tr>'; return; }
  body.innerHTML = '';
  for(const q of qs){
    const dlq = q.deadLetterQueue
      ? '<span class="tag on">'+esc(q.deadLetterQueue)+'</span>'
      : '<span class="dash">—</span>';
    const persist = String(q.persistent)==='true'
      ? '<span class="tag">disk</span>' : '<span class="tag">memory</span>';
    const zero = v => num(v)===0 ? ' zero' : '';
    const tr = el(
      '<tr>'+
        '<td class="name">'+esc(q.name)+'</td>'+
        '<td class="r num fig'+zero(q.depth)+'">'+fmt(q.depth)+'</td>'+
        '<td class="r num fig'+zero(q.inFlight)+'">'+fmt(q.inFlight)+'</td>'+
        '<td class="r num fig'+zero(q.waiters)+'">'+fmt(q.waiters)+'</td>'+
        '<td>'+dlq+'</td>'+
        '<td>'+persist+'</td>'+
        '<td><div class="act">'+
          '<input type="text" placeholder="message" aria-label="Publish to '+esc(q.name)+'">'+
          '<button class="primary">Publish</button>'+
        '</div></td>'+
      '</tr>');
    const inp = tr.querySelector('input'), btn = tr.querySelector('button');
    const send = () => { if(!inp.value) return; post('/queues/'+encodeURIComponent(q.name)+'/messages', {payload:inp.value}); inp.value=''; };
    btn.onclick = send;
    inp.onkeydown = e => { if(e.key==='Enter') send(); };
    body.appendChild(tr);
  }
  restoreTyping(body, typing);
}

function renderTopics(ts){
  document.getElementById('tCount').textContent = ts.length + (ts.length===1?' topic':' topics');
  const body = document.getElementById('tBody');
  if(!ts.length){ body.innerHTML = '<tr><td colspan="2" class="empty">No topics.</td></tr>'; return; }
  body.innerHTML = ts.map(t => {
    const subs = t.subscribers || [];
    const cell = subs.length
      ? '<div class="chips">'+subs.map(s=>'<span class="chip">'+esc(s)+'</span>').join('')+'</div>'
      : '<span class="warnpill">no subscribers — publishes reach nobody</span>';
    return '<tr><td class="name">'+esc(t.name)+'</td><td>'+cell+'</td></tr>';
  }).join('');
}

function renderLogs(ls){
  document.getElementById('lCount').textContent = ls.length + (ls.length===1?' log':' logs');
  const host = document.getElementById('logs');
  if(!ls.length){ host.innerHTML = '<div class="empty">No logs.</div>'; return; }
  host.innerHTML = '';
  for(const lg of ls){
    const span = Math.max(1, num(lg.endOffset) - num(lg.beginOffset));
    const groups = lg.groups || [];
    const gRows = groups.map(g => {
      const lag = num(g.lag);
      const ratio = Math.min(1, lag / span);
      const level = lag===0 ? 'ok' : (ratio < 0.25 ? 'warn' : 'crit');
      const barW = Math.round(Math.max(lag>0?6:0, ratio*100));
      return '<div class="grp">'+
        '<span class="gname">'+esc(g.name)+'</span>'+
        '<span class="meta num">committed '+fmt(g.committed)+'</span>'+
        '<span class="meta num">pos '+fmt(g.position)+'</span>'+
        '<span class="lagcell">'+
          '<span class="lagbar '+level+'"><i style="width:'+barW+'%"></i></span>'+
          '<span class="num lagfig '+level+'">lag '+fmt(lag)+'</span>'+
        '</span>'+
      '</div>';
    }).join('') || '<div class="empty" style="padding:8px 0">No consumer groups.</div>';

    const card = el('<div style="padding:16px 0;border-bottom:1px solid var(--rule)"></div>');
    card.innerHTML =
      '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px">'+
        '<span class="name" style="font-size:14px">'+esc(lg.name)+'</span>'+
        '<span class="mono-small meta">offsets '+fmt(lg.beginOffset)+'–'+fmt(lg.endOffset)+'</span>'+
        '<span class="mono-small meta">'+fmt(lg.records)+' / '+fmt(lg.maxRecords)+' records</span>'+
        '<span class="tag">'+esc(lg.resetPolicy)+'</span>'+
        (num(lg.retentionMs)>0 ? '<span class="mono-small meta">retain '+fmt(Math.round(num(lg.retentionMs)/1000))+'s</span>' : '<span class="mono-small meta">retain ∞</span>')+
        '<button style="margin-left:auto">Append</button>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+gRows+'</div>';
    card.querySelector('button').onclick = () => post('/logs/'+encodeURIComponent(lg.name)+'/records', {payload:'record @'+new Date().toISOString()});
    // wire per-group commit/rewind
    Array.from(card.querySelectorAll('.grp')).forEach((row,i) => {
      const g = groups[i]; if(!g) return;
      const ctl = el('<span class="lagcell" style="gap:6px"></span>');
      const base = '/logs/'+encodeURIComponent(lg.name)+'/groups/'+encodeURIComponent(g.name);
      const c = el('<button>Commit ▸end</button>'); c.onclick = ()=>post(base+'/commit',{offset:num(lg.endOffset)});
      const r = el('<button>Rewind</button>'); r.onclick = ()=>post(base+'/seek',{position:'earliest'});
      ctl.appendChild(c); ctl.appendChild(r);
      row.appendChild(ctl);
      row.style.gridTemplateColumns = '1fr auto auto auto auto';
    });
    host.appendChild(card);
  }
}

function render(d){
  renderQueues(d.queues||[]);
  renderTopics(d.topics||[]);
  renderLogs(d.logs||[]);
}

function setConn(ok){
  if(ok){
    conn.className = 'conn live'; connText.textContent = 'live · '+new Date().toLocaleTimeString();
    banner.className = 'banner';
  } else {
    conn.className = 'conn down'; connText.textContent = 'disconnected';
    banner.className = 'banner show';
    // Never show invented figures: on a failed poll the last real numbers stay
    // on screen and are labelled stale, and before the first success the view
    // is simply empty.
    banner.textContent = everConnected
      ? 'Lost connection to /stats — the figures below are stale.'
      : 'Cannot reach /stats. Is the server running on this port?';
  }
}

async function post(path, payload){
  try {
    await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    poll();
  } catch(e){ /* the connection indicator surfaces failures */ }
}

async function poll(){
  try {
    const r = await fetch('/stats', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    everConnected = true;
    render(d);
    setConn(true);
  } catch(e){
    setConn(false);
  }
}

render(EMPTY);
setConn(false);
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
